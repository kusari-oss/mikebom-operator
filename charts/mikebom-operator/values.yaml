image:
  repository: ghcr.io/kusari-oss/mikebom-operator
  tag: v0.1.0-alpha.1
  pullPolicy: IfNotPresent

mikebom:
  # Default mikebom image used by Job pods when NamespaceScan.spec.mikebomImage
  # is unset. Pin to a specific digest in production.
  image: ghcr.io/kusari-oss/mikebom:v0.1.0-alpha.51

defaults:
  scanFormat: cyclonedx-json

# Default output backend for Helm-managed NamespaceScan templates.
# Supported types: pvc, s3, oci.
#
# Examples:
#
# 1. PVC backend — the operator does NOT create the PVC; admin provisions it.
#   output:
#     type: pvc
#     pvc:
#       claimName: sbom-scratch         # required when type=pvc
#       pathPrefix: ""                  # optional; literal directory name relative to /pvc-output
#
# 2. S3 backend — credentials come from a user-supplied Secret in the
#    operator namespace. The Secret MUST contain `AWS_ACCESS_KEY_ID` and
#    `AWS_SECRET_ACCESS_KEY`. Bucket + region come from the CR.
#   output:
#     type: s3
#     s3:
#       bucket: sboms-prod              # required when type=s3
#       region: us-west-2               # required when type=s3
#       credentialsSecretName: aws-creds  # required when type=s3
#       pathPrefix: ""                  # optional; literal key prefix under the bucket
#
# 3. OCI backend — credentials come from a user-supplied dockerconfigjson
#    Secret. Each SBOM is pushed as an OCI artifact tagged with the image
#    hash. Use `kubectl create secret docker-registry` to provision creds.
#   output:
#     type: oci
#     oci:
#       registry: ghcr.io               # required when type=oci
#       repository: kusari-oss/sboms    # required when type=oci
#       credentialsSecretName: registry-creds  # required when type=oci
output: {}

rbac:
  create: true

serviceAccount:
  create: true
  name: ""

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

leaderElection:
  enabled: true
  leaseName: mikebom-operator-leader

nameOverride: ""
fullnameOverride: ""
