apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: namespacescans.kusari.dev
spec:
  group: kusari.dev
  names:
    categories: []
    kind: NamespaceScan
    plural: namespacescans
    shortNames:
    - nsscan
    singular: namespacescan
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for NamespaceScanSpec via `CustomResource`
        properties:
          spec:
            properties:
              mikebomImage:
                description: Pinned mikebom image (e.g., `ghcr.io/kusari-oss/mikebom:v0.1.0-alpha.70`).
                type: string
              output:
                properties:
                  oci:
                    nullable: true
                    properties:
                      credentialsSecretName:
                        description: Name of a Kubernetes Secret of type `kubernetes.io/dockerconfigjson` in the operator's namespace. The output-upload container mounts this Secret at `/docker-config/config.json` (via the standard `.dockerconfigjson` key) and exports `DOCKER_CONFIG=/docker-config` so `oras` (and any other docker-config-aware tool) finds the credentials.
                        nullable: true
                        type: string
                      registry:
                        type: string
                      repository:
                        type: string
                    required:
                    - registry
                    - repository
                    type: object
                  pvc:
                    nullable: true
                    properties:
                      claimName:
                        type: string
                      pathPrefix:
                        nullable: true
                        type: string
                    required:
                    - claimName
                    type: object
                  s3:
                    nullable: true
                    properties:
                      bucket:
                        type: string
                      credentialsSecretName:
                        description: 'Name of a Kubernetes Secret in the operator''s namespace that holds AWS credentials. The Secret MUST contain at minimum the keys `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`. The output-upload container reads them via `envFrom: { secretRef }`.'
                        nullable: true
                        type: string
                      pathPrefix:
                        nullable: true
                        type: string
                      region:
                        type: string
                    required:
                    - bucket
                    - region
                    type: object
                  type:
                    enum:
                    - pvc
                    - s3
                    - oci
                    type: string
                required:
                - type
                type: object
              scanFormat:
                enum:
                - cyclonedx-json
                - spdx-2.3-json
                - spdx-3-json
                type: string
              schedule:
                properties:
                  cron:
                    nullable: true
                    type: string
                  interval:
                    description: Go-style duration string (`6h`, `30m`, etc.).
                    nullable: true
                    type: string
                type: object
              target:
                properties:
                  kinds:
                    description: Workload kinds. Defaults to `[Pod]` per plan §5 note.
                    items:
                      type: string
                    type: array
                  labelSelector:
                    nullable: true
                    type: string
                  namespaces:
                    items:
                      type: string
                    type: array
                type: object
            required:
            - mikebomImage
            - output
            - scanFormat
            - schedule
            - target
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      nullable: true
                      type: string
                    message:
                      nullable: true
                      type: string
                    reason:
                      nullable: true
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              lastReconciledAt:
                description: Wallclock of the most recent reconcile attempt. Refreshed every reconcile cycle even when no status transition occurred. Distinct from `last_scan_completed_at`, which is reserved for actual scan completion in feature 003+.
                nullable: true
                type: string
              lastScanCompletedAt:
                nullable: true
                type: string
              nextScheduledScanAt:
                description: 'Feature 009: next scheduled scan instant (RFC 3339). Computed from `spec.schedule` + `last_scan_completed_at` (anchor fallback: `metadata.creationTimestamp`) + per-CR jitter. Populated on every reconcile that produces a terminal scan state (ScanCompleted / ScanFailed). Always in the future relative to the anchor.'
                nullable: true
                type: string
              scannedImages:
                default: []
                items:
                  properties:
                    completedAt:
                      type: string
                    imageRef:
                      type: string
                    resolvedSha:
                      nullable: true
                      type: string
                    sbomLocation:
                      type: string
                  required:
                  - completedAt
                  - imageRef
                  - sbomLocation
                  type: object
                type: array
            type: object
        required:
        - spec
        title: NamespaceScan
        type: object
    served: true
    storage: true
    subresources:
      status: {}
