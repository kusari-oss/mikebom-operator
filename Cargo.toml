[workspace]
resolver = "2"
members = [
    "crates/operator",
    "crates/ctl",
    "e2e",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kusari-oss/mikebom-operator"
authors = ["Kusari OSS Contributors"]

[workspace.dependencies]
kube = { version = "0.97", default-features = false, features = ["client", "derive", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.23", features = ["v1_31"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
schemars = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
sha2 = "0.10"
cron = "0.12"
humantime = "2.1"
