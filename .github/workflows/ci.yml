name: CI

on:
  push:
    branches: [main]
  pull_request:

# Workflow-level default: read-only. Individual jobs may grant additional
# scopes only when justified (none currently need write access).
permissions:
  contents: read

jobs:
  rust:
    name: cargo test + clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  helm:
    name: helm chart-testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      # Pinned to the commit BEFORE helm/chart-testing-action#184 bumped
      # sigstore/cosign-installer 3.8.1 → 4.0.0. The 4.0.0 bump causes
      # Rekor signature verification to fail with `ecdsa: Invalid IEEE_P1363
      # encoded bytes` when the action installs the `ct` binary. Bump back
      # to the v2 head once upstream resolves the issue.
      - uses: helm/chart-testing-action@4ea74f62c9503ceaffb14a189bf252e7c68e87a3 # v2 (pre-cosign-4.0.0)
      - name: ct lint
        run: ct lint --charts charts/mikebom-operator --validate-maintainers=false

  # Feature 011 T014: shellcheck the nightly bump scripts.
  shellcheck:
    name: shellcheck nightly scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: shellcheck
        run: |
          # shellcheck is preinstalled on ubuntu-latest. Each script's
          # shebang selects the dialect (bash for check-versions.sh, sh
          # for the nightly-*.sh set), so we do NOT force `-s sh`.
          shellcheck \
            .github/scripts/check-versions.sh \
            .github/scripts/nightly-detect.sh \
            .github/scripts/nightly-bump.sh \
            .github/scripts/nightly-open-pr.sh \
            .github/scripts/nightly-tag.sh

  # Feature 011 T013: SHA-pin discipline check for the nightly workflows.
  # Every `uses:` in the two new workflows MUST reference a 40-char SHA
  # (plan.md: "zero new SHAs"). Also enforced retroactively across the
  # existing workflows.
  pinned-actions:
    name: verify SHA pins in nightly workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: fail on unpinned uses
        run: |
          set -eu
          unpinned="$(grep -rn "uses: " \
            .github/workflows/nightly-mikebom-bump.yml \
            .github/workflows/tag-on-nightly-merge.yml \
            | grep -vE 'uses: [^ ]+@[0-9a-f]{40}' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::unpinned action reference(s) found:"
            printf '%s\n' "$unpinned"
            exit 1
          fi
          echo "all nightly workflow actions are SHA-pinned"
